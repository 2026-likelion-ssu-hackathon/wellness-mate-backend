services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wellness_mate
      POSTGRES_USER: wellness_mate
      POSTGRES_PASSWORD: wellness_mate_local_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wellness_mate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness_mate -d wellness_mate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  wellness_mate_postgres_data:
